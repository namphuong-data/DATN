networks:
  pipeline_net:
    driver: bridge

volumes:
  minio_data:
  spark_logs:
  ivy_cache:
  ml_models:       # lưu model output dùng chung

services:
  # ── MinIO ──────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - pipeline_net

  # ── Spark Master ───────────────────────────────────────────
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-master
    restart: unless-stopped
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin123
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./spark/jobs:/opt/spark/jobs
      - ./dataset:/opt/spark/dataset:ro
      - spark_logs:/opt/spark/logs
      - ivy_cache:/root/.ivy2
    networks:
      - pipeline_net

  # ── Spark Worker 1 ─────────────────────────────────────────
  spark-worker-1:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-worker-1
    restart: unless-stopped
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin123
    ports:
      - "8081:8081"
    volumes:
      - ./spark/jobs:/opt/spark/jobs
      - ./dataset:/opt/spark/dataset:ro
      - spark_logs:/opt/spark/logs
      - ivy_cache:/root/.ivy2
    networks:
      - pipeline_net

  # ── Spark Worker 2 ─────────────────────────────────────────
  spark-worker-2:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-worker-2
    restart: unless-stopped
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin123
    ports:
      - "8082:8082"
    volumes:
      - ./spark/jobs:/opt/spark/jobs
      - ./dataset:/opt/spark/dataset:ro
      - spark_logs:/opt/spark/logs
      - ivy_cache:/root/.ivy2
    networks:
      - pipeline_net

  # ── ML Trainer (LSTM) ──────────────────────────────────────
  # Service riêng, tách hoàn toàn khỏi Spark để tránh xung đột
  # dependency (protobuf, grpcio, tensorflow vs pyspark).
  # Chạy 1 lần khi cần train: docker compose run --rm ml-trainer
  ml-trainer:
    build:
      context: .
      dockerfile: Dockerfile.ml
    container_name: ml-trainer
    # Không restart tự động — chỉ chạy khi gọi thủ công
    restart: "no"
    depends_on:
      - minio
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
    volumes:
      - ./spark/jobs:/app/spark/jobs   # mount code jobs
      - ml_models:/app/models          # lưu model output
    networks:
      - pipeline_net
    # Mặc định không chạy gì, gọi thủ công:
    #   docker compose run --rm ml-trainer python spark/jobs/train_lstm_demand.py
    command: ["echo", "ML Trainer ready. Run: docker compose run --rm ml-trainer python spark/jobs/train_lstm_demand.py"]
